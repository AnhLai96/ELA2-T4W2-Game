<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Explorers: Journey Through the Sky!</title><style>
:root{--navy:#101d4c;--gold:#ffd86e;--cream:#fffaf1;--burgundy:#80132f}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#20294b;font-family:'Trebuchet MS',Arial,sans-serif;background:radial-gradient(ellipse at 20% 15%,#324a9c 0%,transparent 40%),radial-gradient(ellipse at 85% 70%,#412577 0%,transparent 43%),#10183e;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.75;background-image:radial-gradient(2px 2px at 10% 20%,white 99%,transparent),radial-gradient(2px 2px at 30% 60%,white 99%,transparent),radial-gradient(3px 3px at 65% 18%,#ffeaa3 99%,transparent),radial-gradient(2px 2px at 82% 43%,white 99%,transparent),radial-gradient(2px 2px at 50% 80%,white 99%,transparent);background-size:210px 190px;animation:twinkle 6s infinite alternate}@keyframes twinkle{from{opacity:.35}to{opacity:1}}.shell{position:relative;max-width:960px;margin:20px auto;padding:0 15px 24px}.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#211b60,#2c469a 65%,#432d86);border:3px solid #f6d67b;border-radius:28px 28px 18px 18px;box-shadow:0 15px 35px #050c28a0;color:white;text-align:center;padding:25px 15px 16px}.eyebrow{font-weight:900;color:#ffde80;letter-spacing:1.5px;font-size:12px}.hero h1{font-size:clamp(27px,5vw,44px);line-height:1.08;margin:9px 0;color:white;text-shadow:0 3px 0 #15133c}.hero p{margin:6px 0 0;color:#e6eaff}.scene{position:relative;height:125px;max-width:680px;margin:8px auto 0}.planet{position:absolute;border-radius:50%;box-shadow:inset -12px -12px 20px #0004,0 0 20px #ffffff20}.sun{width:90px;height:90px;left:3%;top:8px;background:radial-gradient(circle at 35% 35%,#fff9ad,#ffc03d 65%,#f47b28);box-shadow:0 0 28px #ffc44b}.earth{width:100px;height:100px;left:42%;top:10px;background:radial-gradient(circle at 30% 30%,#9af1f8,#248bd4 55%,#133e91)}.earth:after{content:'🌎';position:absolute;inset:0;display:grid;place-items:center;font-size:78px}.moon{width:63px;height:63px;right:8%;top:30px;background:radial-gradient(circle at 35% 30%,#fff,#d1d9e6 60%,#8994a9)}.rocket{position:absolute;left:24%;top:22px;font-size:64px;transform:rotate(25deg);animation:float 3s ease-in-out infinite}.sat{position:absolute;right:25%;top:4px;font-size:39px;animation:float 4s ease-in-out infinite alternate}@keyframes float{50%{transform:translateY(-9px) rotate(14deg)}}.main{background:var(--cream);border:3px solid #f6d67b;border-top:0;border-radius:0 0 26px 26px;padding:24px;box-shadow:0 20px 45px #0006}.status{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}.chip{background:#f4e5ff;border:2px solid #d7c0f7;border-radius:40px;padding:9px 15px;font-weight:900}.score{background:#fff0b6;border-color:#e8bd4f}.trail{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:18px 0}.stop{background:#dfe2f0;color:#66718d;border-radius:50%;aspect-ratio:1;display:grid;place-items:center;font-size:clamp(12px,2.4vw,22px);font-weight:bold;border:2px solid #c5c8d9}.stop.done{background:#ffe59b;border-color:#e4ac38;color:#7b4a00}.stop.active{background:#b5edff;border-color:#2584b7;box-shadow:0 0 0 3px #c4f1ff}.zone{font-weight:900;color:#6d358e;text-transform:uppercase;letter-spacing:1px;font-size:12px;margin:12px 0}.qcard{background:#fff;border:2px solid #ded5f4;border-radius:22px;padding:20px;box-shadow:0 5px 0 #e9e3f7}.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}.qcard h2{font-size:clamp(21px,3.8vw,29px);line-height:1.3;margin:14px 0 19px}.read{border:0;border-radius:30px;background:#e9e7ff;color:#2c3277;padding:10px 15px;font-weight:900;cursor:pointer}.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.answer{min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:3px solid #d7d7ef;border-radius:19px;background:linear-gradient(#fff,#f4f5ff);padding:15px 8px;cursor:pointer;font-size:16px;color:#263254;font-weight:900;transition:transform .16s,border-color .16s;overflow-wrap:anywhere}.answer:hover:not(:disabled){transform:translateY(-4px);border-color:#8c7fe1;background:#fff9e9}.answer .art{font-size:clamp(38px,6vw,60px);line-height:1.1}.answer .letter{font-size:12px;background:#e5e6f7;border-radius:50%;padding:5px 9px}.answer.good{border-color:#2c9d5c;background:#dff8e6}.answer.bad{border-color:#d25762;background:#ffe7e7}.answer:disabled{cursor:default}.feedback{min-height:42px;margin-top:13px;font-weight:900;color:#40508b}.feedback.yes{color:#187c43}.feedback.no{color:#a2384b}.controls{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:17px}.btn{border:0;background:var(--burgundy);color:white;padding:13px 20px;border-radius:14px;font-size:16px;font-weight:900;cursor:pointer}.btn.secondary{background:#e6e1f2;color:#48356e}.btn:disabled{opacity:.4;cursor:not-allowed}.result{text-align:center;padding:20px}.result h2{font-size:35px;color:#80132f}.medal{font-size:80px}.review{display:grid;gap:9px;margin-top:20px;text-align:left}.reviewitem{padding:12px;border-radius:12px;background:#fff;border:1px solid #e4d9ef}.reviewitem strong{color:#80132f}.confetti{position:fixed;pointer-events:none;z-index:5;font-size:30px;animation:pop .9s ease-out forwards}@keyframes pop{to{transform:translateY(-90px) rotate(60deg);opacity:0}}.foot{text-align:center;color:#d8defc;font-size:12px;margin-top:15px}@media(max-width:620px){.main{padding:14px}.qcard{padding:14px}.answers{grid-template-columns:1fr}.answer{min-height:85px;flex-direction:row;justify-content:flex-start;text-align:left}.answer .art{font-size:38px}.scene{height:105px}.earth{left:45%;width:78px;height:78px}.earth:after{font-size:60px}.sun{width:70px;height:70px}.moon{width:50px;height:50px}.rocket{font-size:48px}.sat{font-size:30px}}
</style></head><body><div class="shell"><header class="hero"><div class="eyebrow">WPA ELA · GRADE 2 · TERM 4 · WEEK 2 · LESSON 1</div><h1>🚀 Space Explorers<br>Journey Through the Sky!</h1><p>Read · Discover · Explore · Shine</p><div class="scene" aria-hidden="true"><div class="planet sun"></div><div class="rocket">🚀</div><div class="planet earth"></div><div class="sat">🛰️</div><div class="planet moon"></div></div></header><main class="main"><div class="status"><div id="counter" class="chip">Mission 1 of 10</div><div id="score" class="chip score">⭐ 0 / 100 points</div></div><div class="trail" id="trail" aria-label="Mission progress"></div><section class="qcard" id="game"><div class="qtop"><div class="zone" id="zone">Mission Control</div><button class="read" id="read" type="button">🔊 Read Aloud</button></div><h2 id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div></section><div class="controls" id="controls"><button class="btn secondary" id="prev" type="button">← Previous</button><button class="btn secondary" id="mute" type="button">🔔 Sound On</button><button class="btn" id="next" type="button" disabled>Next Mission →</button></div></main><p class="foot">Space Explorers · Offline-friendly learning adventure · 10 missions, 100 points</p></div><script>
const DATA=[{"q": "Which object is a star?", "opts": ["The Sun", "The Moon", "Earth"], "answer": 0}, {"q": "What does a telescope help us do?", "opts": ["Hear sounds", "See faraway objects", "Make stars"], "answer": 1}, {"q": "What is a crater?", "opts": ["A round hollow", "A bright star", "A type of plant"], "answer": 0}, {"q": "Which object travels around Earth?", "opts": ["The Sun", "The Moon", "Jupiter"], "answer": 1}, {"q": "What does the Sun give Earth?", "opts": ["Only rain", "Light and warmth", "Sand"], "answer": 1}, {"q": "What kind of text is Sky Lights?", "opts": ["Nonfiction", "A fairy tale", "A recipe"], "answer": 0}, {"q": "What can a photograph help a reader understand?", "opts": ["How something looks", "What a character thinks", "How many pages a book has"], "answer": 0}, {"q": "What is Earth?", "opts": ["A star", "A planet", "A telescope"], "answer": 1}, {"q": "Which object reflects sunlight?", "opts": ["The Moon", "A star", "The Sun"], "answer": 0}, {"q": "What should you do when reading a picture and text?", "opts": ["Ignore the picture", "Use both to find information", "Read only the title"], "answer": 1}];
const ICONS=[["☀️", "🌙", "🌎"], ["👂", "🔭", "✨"], ["🕳️", "⭐", "🌱"], ["☀️", "🌙", "🪐"], ["🌧️", "🌞", "🏖️"], ["📚", "🧚", "🍲"], ["📷", "💭", "📖"], ["⭐", "🌍", "🔭"], ["🌙", "⭐", "☀️"], ["🖼️", "🔎", "📕"]];
const ZONES=['Sunshine Station','Telescope Tower','Moon Crater Base','Moon Orbit','Solar Energy Lab','Nonfiction Library','Photo Observatory','Planet Earth','Moonlight Mission','Reading Rocket'];
let current=0,answers=Array(DATA.length).fill(null),soundOn=true;
const $=id=>document.getElementById(id);
function score(){return answers.reduce((n,a,i)=>n+(a===DATA[i].answer?10:0),0)}
function beep(good){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=good?680:240;gain.gain.value=.055;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.14);osc.onended=()=>ctx.close()}catch(e){}}
function celebrate(){for(let k=0;k<7;k++){const s=document.createElement('span');s.className='confetti';s.textContent=['⭐','✨','🌟'][k%3];s.style.left=(25+Math.random()*50)+'%';s.style.top=(40+Math.random()*20)+'%';document.body.appendChild(s);setTimeout(()=>s.remove(),950)}}
function render(){if(current>=DATA.length){finish();return}const item=DATA[current],choice=answers[current];$('counter').textContent=`Mission ${current+1} of ${DATA.length}`;$('score').textContent=`⭐ ${score()} / 100 points`;$('zone').textContent='🪐 '+ZONES[current];$('question').textContent=item.q;$('trail').innerHTML='';DATA.forEach((_,i)=>{const el=document.createElement('div');el.className='stop'+(answers[i]!==null?' done':'')+(i===current?' active':'');el.textContent=answers[i]!==null?'★':i+1;el.title='Mission '+(i+1);$('trail').appendChild(el)});$('answers').innerHTML='';item.opts.forEach((option,j)=>{const b=document.createElement('button');b.type='button';b.className='answer';if(choice!==null){b.disabled=true;if(j===item.answer)b.classList.add('good');else if(j===choice)b.classList.add('bad')}const letter=document.createElement('span');letter.className='letter';letter.textContent='ABC'[j];const art=document.createElement('span');art.className='art';art.setAttribute('aria-hidden','true');art.textContent=ICONS[current][j];const label=document.createElement('span');label.textContent=option;b.append(letter,art,label);b.onclick=()=>select(j);$('answers').appendChild(b)});$('feedback').className='feedback '+(choice===null?'':choice===item.answer?'yes':'no');$('feedback').textContent=choice===null?'Choose the best answer to collect your Space Star!':choice===item.answer?'Brilliant! You earned 10 Space Points!':'Good try! The correct answer is: '+item.opts[item.answer];$('prev').disabled=current===0;$('next').disabled=choice===null;$('next').textContent=current===DATA.length-1?'See My Award →':'Next Mission →';$('read').style.display='inline-block';$('controls').style.display='flex';}
function select(j){if(answers[current]!==null)return;answers[current]=j;beep(j===DATA[current].answer);if(j===DATA[current].answer)celebrate();render()}
function speak(){if(!('speechSynthesis' in window)){alert('Read-aloud is not supported in this browser.');return}speechSynthesis.cancel();if(current>=DATA.length)return;const x=DATA[current];const utter=new SpeechSynthesisUtterance(x.q+'. '+x.opts.map((o,i)=>'Option '+('ABC'[i])+': '+o).join('. '));utter.lang='en-US';utter.rate=.82;speechSynthesis.speak(utter)}
function finish(){$('counter').textContent='Mission Complete!';$('score').textContent=`⭐ ${score()} / 100 points`;$('trail').innerHTML=DATA.map(()=>'🌟').join(' ');$('game').innerHTML='<div class="result"><div class="medal">🏆🚀</div><h2>Space Explorer Award!</h2><p id="resultscore"></p><p>You explored the sky and completed all 10 missions!</p><button class="btn" id="again">🚀 Play Again</button><h3>My Answer Review</h3><div class="review" id="review"></div></div>';$('resultscore').textContent='Your score: '+score()+' / 100';const list=$('review');DATA.forEach((item,i)=>{const d=document.createElement('div');d.className='reviewitem';const title=document.createElement('strong');title.textContent=(i+1)+'. '+item.q;const p=document.createElement('div');p.textContent='Your answer: '+item.opts[answers[i]]+' '+(answers[i]===item.answer?'✓':'✗')+' | Correct: '+item.opts[item.answer];d.append(title,p);list.appendChild(d)});$('again').onclick=()=>{current=0;answers=Array(DATA.length).fill(null);location.reload()};$('controls').style.display='none';}
$('read').onclick=speak;$('prev').onclick=()=>{if(current>0){current--;render()}};$('next').onclick=()=>{if(answers[current]===null)return;current++;render()};$('mute').onclick=()=>{soundOn=!soundOn;$('mute').textContent=soundOn?'🔔 Sound On':'🔕 Sound Off'};render();
</script></body></html>
